<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SmogCast – прогноз PM2.5 в Алматы на 72 часа с обновлением каждый час" />
    <meta name="theme-color" content="#1f6fd1" />
    <title>SmogCast – прогноз смога в Алматы</title>
    <!-- тема – до загрузки CSS и JS, иначе мелькнёт переход со светлой на тёмную -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('smogcast-theme')
          var isDark = saved === 'dark' || (saved !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', isDark)
          document.documentElement.style.colorScheme = isDark ? 'dark' : 'light'
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
