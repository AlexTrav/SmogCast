# собирает сайт и публикует его на GitHub Pages – только после успешного CI (все автотесты зелёные) по push в
# main; вручную – кнопкой Run workflow. Автотесты сайта уже прошли в CI, здесь – только сборка и выкладка
name: Deploy site to GitHub Pages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # API на Render (бесплатный тариф засыпает – сайт показывает плашку «Сервер просыпается…»)
  VITE_API_BASE_URL: https://smogcast-backend.onrender.com

jobs:
  build:
    # после CI – только если он успешен и запущен push-ем (не pull request)
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      # ровно тот коммит, который проверил CI
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      # та же стадия сборки, что в frontend/Dockerfile: проверка типов и Vite с базовым путём /SmogCast/
      - name: Build in Docker
        run: |
          docker build --target build \
            --build-arg VITE_API_BASE_URL="$VITE_API_BASE_URL" \
            --build-arg BASE="/${{ github.event.repository.name }}/" \
            -t smogcast-pages frontend
          docker create --name pages smogcast-pages
          docker cp pages:/app/dist ./dist
      # GitHub Pages не умеет перенаправлять пути SPA на index.html – отдаём его и вместо 404
      - name: SPA fallback for client-side routing
        run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
