# ежечасное обновление базы Neon: свежие часы ряда, снимки прогнозов CAMS и погоды IFS, сетка для карты,
# затем прогнозы всех моделей на 72 ч (model_forecasts). GitHub может запустить cron с опозданием или пропустить
# запуск – следующий запуск догонит ряд (последние 7 дней перезапрашиваются), а пропущенный снимок прогноза
# восстановить нельзя
name: Hourly update

on:
  schedule:
    - cron: "17 * * * *"  # не в начале часа: в это время очередь GitHub перегружена
  workflow_dispatch:

# запуски не накладываются друг на друга: следующий ждёт окончания текущего
concurrency:
  group: hourly-update
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # образы собираются с кэшем слоёв GitHub Actions – зависимости ставятся заново, только если они изменились
      - name: Build data image
        uses: docker/build-push-action@v6
        with:
          context: data
          load: true
          tags: smogcast-data
          cache-from: type=gha,scope=data
          cache-to: type=gha,mode=max,scope=data
      - name: Update series and save forecasts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # порог очистки снимков (МБ) – переменная репозитория (Settings → Secrets and variables → Variables);
          # если её нет, берётся значение по умолчанию из data/collect/config.py
          DB_LIMIT_MB: ${{ vars.DB_LIMIT_MB }}
        run: docker run --rm -e DATABASE_URL -e DB_LIMIT_MB smogcast-data hourly
      - name: Build model image
        uses: docker/build-push-action@v6
        with:
          context: model
          load: true
          tags: smogcast-model
          cache-from: type=gha,scope=model
          cache-to: type=gha,mode=max,scope=model
      # прогнозы всех моделей на 72 ч от последнего часа ряда -> model_forecasts, время моделей -> model_runs
      - name: Forecast with all models
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: >
          docker run --rm -e DATABASE_URL -v "$PWD/model:/model" -v "$PWD/research:/research:ro"
          smogcast-model python -W ignore live.py
