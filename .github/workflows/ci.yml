# автотесты всех частей проекта на каждый push в main и на каждый pull request: сбор данных, исследование,
# модели, API и сайт – параллельно, в тех же Docker-образах, что и локально (make test). Образы собираются с
# кэшем слоёв GitHub Actions (общим с ежечасной задачей), поэтому повторный прогон занимает минуты.
# Выкладка сайта на GitHub Pages и API на Render идёт только после успешного прогона
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  data:
    name: Сбор данных (pytest + Postgres 18)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # имя образа – то, которое ждёт docker compose (проект smogcast-data-test, служба tests)
      - uses: docker/build-push-action@v6
        with:
          context: data
          load: true
          tags: smogcast-data-test-tests
          cache-from: type=gha,scope=data
          cache-to: type=gha,mode=max,scope=data
      - name: pytest
        working-directory: data
        run: |
          docker compose -f compose.test.yml run --rm tests; status=$?
          docker compose -f compose.test.yml down -v; exit $status

  research:
    name: Исследование (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: research
          load: true
          tags: smogcast-research
          cache-from: type=gha,scope=research
          cache-to: type=gha,mode=max,scope=research
      - name: pytest
        run: >
          docker run --rm -v "$PWD/research:/research" -v "$PWD/data/series:/series:ro"
          smogcast-research python -m pytest -q -p no:cacheprovider tests

  model:
    name: Модели (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: model
          load: true
          tags: smogcast-model
          cache-from: type=gha,scope=model
          cache-to: type=gha,mode=max,scope=model
      - name: pytest
        run: >
          docker run --rm -v "$PWD/model:/model" -v "$PWD/research:/research:ro" -v "$PWD/data/series:/series:ro"
          smogcast-model python -m pytest -q -p no:cacheprovider tests

  backend:
    name: API (pytest + Postgres 18)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # схему тестовой базы создаёт образ data, тесты идут в образе API (имена – как у docker compose)
      - uses: docker/build-push-action@v6
        with:
          context: data
          load: true
          tags: smogcast-api-test-schema
          cache-from: type=gha,scope=data
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          load: true
          tags: smogcast-api-test-tests
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: pytest
        working-directory: backend
        run: |
          docker compose -f compose.test.yml run --rm tests; status=$?
          docker compose -f compose.test.yml down -v; exit $status

  frontend:
    name: Сайт (Vitest и проверка типов)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Vitest
        uses: docker/build-push-action@v6
        with:
          context: frontend
          target: test
          load: true
          tags: smogcast-frontend-test
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - run: docker run --rm smogcast-frontend-test
      # проверка типов (vue-tsc) и сборка Vite – та же стадия, что перед выкладкой
      - name: Type check and build
        uses: docker/build-push-action@v6
        with:
          context: frontend
          target: build
          cache-from: type=gha,scope=frontend
