# тесты с настоящим Postgres той же версии, что в Neon (18): make test
name: smogcast-data-test

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_PASSWORD: test
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      timeout: 3s
      retries: 20

  tests:
    build: .
    entrypoint: ["python", "-m", "pytest", "-q", "-p", "no:cacheprovider", "tests"]
    environment:
      TEST_DATABASE_URL: postgresql://postgres:test@db:5432/postgres
    depends_on:
      db:
        condition: service_healthy
