# Render Blueprint: API SmogCast (бесплатный план, Франкфурт – рядом с базой Neon).
# Строка подключения DATABASE_URL – пользователь базы только для чтения (make -C backend readonly ->
# SmogCast/.env.api); Render спрашивает её один раз при создании сервиса
services:
  - type: web
    name: smogcast-backend
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    # выкладка – только когда CI на этом коммите зелёный (.github/workflows/ci.yml)
    autoDeployTrigger: checksPass
    # пересобирать только при изменении API, отчётов моделей или лёгких моделей для пересчёта
    buildFilter:
      paths:
        - backend/**
        - model/reports/**
        - model/artifacts/live/**
        - model/light.py
        - model/lstm.py
        - model/baselines.py
        - model/backtest.py
        - model/weather.py
        - research/prep.py
        - .dockerignore
        - render.yaml
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: "*"
